      - name: Install Gradle 8.5 & Build AAB + APK
        working-directory: android_build
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o gradle.zip
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          unzip -q gradle.zip
          ./gradle-8.5/bin/gradle bundleRelease assembleRelease --no-daemon

      - name: Upload Ready-to-Publish Play Store AAB & APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberBlade-AdMob-PlayStore-Package
          path: |
            android_build/app/build/outputs/bundle/release/*.aab
            android_build/app/build/outputs/apk/release/*.apk

