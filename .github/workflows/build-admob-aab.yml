name: Build Cyber Blade AdMob Android AAB & APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Android AdMob Wrapper Project
        run: |
          mkdir -p android_build/app/src/main/java/com/cyberblade/chronostrike
          mkdir -p android_build/app/src/main/assets
          mkdir -p android_build/app/src/main/res/mipmap-xxxhdpi

          if [ -f "index.html" ]; then
            cp index.html android_build/app/src/main/assets/index.html
          else
            echo "<html><body style='background:#060814;color:#22d3ee;'>Loading Cyber Blade...</body></html>" > android_build/app/src/main/assets/index.html
          fi

          python3 -c '
          import struct, zlib
          def make_png(w, h):
              raw = b""
              for y in range(h):
                  raw += b"\x00"
                  for x in range(w):
                      if abs(x - y) < 18 or abs(x + y - w) < 18:
                          raw += b"\x22\xd3\xee\xff"
                      else:
                          raw += b"\x0f\x17\x2a\xff"
              def chunk(tag, data):
                  return struct.pack("!I", len(data)) + tag + data + struct.pack("!I", zlib.crc32(tag + data) & 0xffffffff)
              return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack("!IIBBBBB", w, h, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
          open("android_build/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png", "wb").write(make_png(192, 192))
          '

          cat << 'EOF' > android_build/settings.gradle
          pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "CyberBladeChronoStrike"
include ':app'
          EOF

          cat << 'EOF' > android_build/build.gradle
          plugins {
    id 'com.android.application' version '8.3.2' apply false
}
          EOF

          cat << 'EOF' > android_build/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
          EOF

          cat << 'EOF' > android_build/app/build.gradle
          plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cyberblade.chronostrike'
    compileSdk 34

    defaultConfig {
        applicationId "com.cyberblade.chronostrike"
        minSdk 23
        targetSdk 34
        versionCode 10
        versionName "3.5.0"
    }

    signingConfigs {
        release {
            def ksFile = file("../signing.keystore")
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: "password"
                keyAlias System.getenv("KEY_ALIAS") ?: "my-key-alias"
                keyPassword System.getenv("KEY_PASSWORD") ?: "password"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig file("../signing.keystore").exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.gms:play-services-ads:23.0.0'
}
