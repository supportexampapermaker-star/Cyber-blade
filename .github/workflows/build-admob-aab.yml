name: Build Cyber Blade AdMob Android AAB & APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Unpack Android AdMob Wrapper Project
        run: |
          echo "" | base64 -d > project.zip
          unzip -o project.zip
          if [ -f "index.html" ]; then
            cp index.html android_build/app/src/main/assets/index.html
          fi

      - name: Build Android App Bundle (.aab) and APK (.apk)
        working-directory: android_build
        run: gradle bundleRelease assembleDebug --no-daemon

      - name: Upload Ready-to-Publish Play Store AAB & Test APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberBlade-AdMob-PlayStore-Package
          path: |
