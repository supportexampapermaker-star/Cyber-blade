          cat << 'EOF' > android_build/app/src/main/java/com/cyberblade/chronostrike/MainActivity.java
          package com.cyberblade.chronostrike;

import android.annotation.SuppressLint;
import android.os.Bundle;
import android.view.Gravity;
import android.view.View;
import android.view.WindowManager;
import android.webkit.JavascriptInterface;
import android.webkit.WebChromeClient;
import android.webkit.WebResourceError;
import android.webkit.WebResourceRequest;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import android.widget.FrameLayout;
import androidx.annotation.NonNull;
import androidx.appcompat.app.AppCompatActivity;

import com.google.android.gms.ads.AdRequest;
import com.google.android.gms.ads.AdSize;
import com.google.android.gms.ads.AdView;
import com.google.android.gms.ads.LoadAdError;
import com.google.android.gms.ads.MobileAds;
import com.google.android.gms.ads.interstitial.InterstitialAd;
import com.google.android.gms.ads.interstitial.InterstitialAdLoadCallback;
import com.google.android.gms.ads.rewarded.RewardedAd;
import com.google.android.gms.ads.rewarded.RewardedAdLoadCallback;
import com.google.android.gms.ads.rewardedinterstitial.RewardedInterstitialAd;
import com.google.android.gms.ads.rewardedinterstitial.RewardedInterstitialAdLoadCallback;

public class MainActivity extends AppCompatActivity {

    // Your Real AdMob Ad Unit IDs
    private static final String BANNER_ID = "ca-app-pub-5448696131672998/7945479093";
    private static final String INTERSTITIAL_ID = "ca-app-pub-5448696131672998/6906273320";
    private static final String REWARDED_INTERSTITIAL_ID = "ca-app-pub-5448696131672998/9727877783";
    private static final String REWARDED_ID = "ca-app-pub-5448696131672998/5728923023";

    // Your Live GitHub Pages URL (auto-updates whenever you push from Google AI Studio!)
    private static final String LIVE_GAME_URL = "https://supportexampapermaker-star.github.io/Cyber-blade/";
    private static final String OFFLINE_FALLBACK_URL = "file:///android_asset/index.html";

    private WebView webView;
    private AdView bannerView;
    private InterstitialAd mInterstitialAd;
    private RewardedAd mRewardedAd;
    private RewardedInterstitialAd mRewardedInterstitialAd;

    @SuppressLint("SetJavaScriptEnabled")
    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        getWindow().setFlags(
            WindowManager.LayoutParams.FLAG_FULLSCREEN,
            WindowManager.LayoutParams.FLAG_FULLSCREEN
        );

        FrameLayout rootLayout = new FrameLayout(this);
        webView = new WebView(this);
        rootLayout.addView(webView, new FrameLayout.LayoutParams(
            FrameLayout.LayoutParams.MATCH_PARENT,
            FrameLayout.LayoutParams.MATCH_PARENT
        ));

        WebSettings ws = webView.getSettings();
        ws.setJavaScriptEnabled(true);
        ws.setDomStorageEnabled(true);
        ws.setDatabaseEnabled(true);
        ws.setMediaPlaybackRequiresUserGesture(false);
        ws.setCacheMode(WebSettings.LOAD_DEFAULT);

        webView.setWebViewClient(new WebViewClient() {
            @Override
            public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                if (request.isForMainFrame()) {
                    view.loadUrl(OFFLINE_FALLBACK_URL);
                }
            }
        });
        webView.setWebChromeClient(new WebChromeClient());
        webView.addJavascriptInterface(new WebAppInterface(), "AndroidAds");
        webView.loadUrl(LIVE_GAME_URL);

        MobileAds.initialize(this, initializationStatus -> {
            setupBanner(rootLayout);
            loadInterstitial();
            loadRewarded();
            loadRewardedInterstitial();
        });

        setContentView(rootLayout);
    }

    private void setupBanner(FrameLayout rootLayout) {
        bannerView = new AdView(this);
        bannerView.setAdUnitId(BANNER_ID);
        bannerView.setAdSize(AdSize.BANNER);
        FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(
            FrameLayout.LayoutParams.WRAP_CONTENT,
            FrameLayout.LayoutParams.WRAP_CONTENT
        );
        params.gravity = Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL;
        rootLayout.addView(bannerView, params);
        bannerView.loadAd(new AdRequest.Builder().build());
    }

    private void loadInterstitial() {
        InterstitialAd.load(this, INTERSTITIAL_ID, new AdRequest.Builder().build(),
            new InterstitialAdLoadCallback() {
                @Override
                public void onAdLoaded(@NonNull InterstitialAd ad) {
                    mInterstitialAd = ad;
                }
                @Override
                public void onAdFailedToLoad(@NonNull LoadAdError error) {
                    mInterstitialAd = null;
                }
            });
    }

    private void loadRewarded() {
        RewardedAd.load(this, REWARDED_ID, new AdRequest.Builder().build(),
            new RewardedAdLoadCallback() {
                @Override
                public void onAdLoaded(@NonNull RewardedAd ad) {
                    mRewardedAd = ad;
                }
                @Override
                public void onAdFailedToLoad(@NonNull LoadAdError error) {
                    mRewardedAd = null;
                }
            });
    }

    private void loadRewardedInterstitial() {
        RewardedInterstitialAd.load(this, REWARDED_INTERSTITIAL_ID, new AdRequest.Builder().build(),
            new RewardedInterstitialAdLoadCallback() {
                @Override
                public void onAdLoaded(@NonNull RewardedInterstitialAd ad) {
                    mRewardedInterstitialAd = ad;
                }
                @Override
                public void onAdFailedToLoad(@NonNull LoadAdError error) {
                    mRewardedInterstitialAd = null;
                }
            });
    }

    public class WebAppInterface {
        @JavascriptInterface
        public void showRewardedAd(String unitId, String rewardType) {
            runOnUiThread(() -> {
                if (mRewardedAd != null) {
                    mRewardedAd.show(MainActivity.this, rewardItem -> {
                        webView.evaluateJavascript(
                            "if(window.onAdMobRewardGranted) window.onAdMobRewardGranted('" + rewardType + "');",
                            null
                        );
                        loadRewarded();
                    });
                } else {
                    loadRewarded();
                }
            });
        }

        @JavascriptInterface
        public void showRewardedInterstitialAd(String unitId, String rewardType) {
            runOnUiThread(() -> {
                if (mRewardedInterstitialAd != null) {
                    mRewardedInterstitialAd.show(MainActivity.this, rewardItem -> {
                        webView.evaluateJavascript(
                            "if(window.onAdMobRewardGranted) window.onAdMobRewardGranted('" + rewardType + "');",
                            null
                        );
                        loadRewardedInterstitial();
                    });
                } else {
                    loadRewardedInterstitial();
                }
            });
        }

        @JavascriptInterface
        public void showInterstitialAd(String unitId) {
            runOnUiThread(() -> {
                if (mInterstitialAd != null) {
                    mInterstitialAd.show(MainActivity.this);
                    mInterstitialAd = null;
                    loadInterstitial();
                } else {
                    loadInterstitial();
                }
            });
        }

        @JavascriptInterface
        public void setBannerVisible(boolean visible) {
            runOnUiThread(() -> {
                if (bannerView != null) {
                    bannerView.setVisibility(visible ? View.VISIBLE : View.GONE);
                }
            });
        }
    }
}
          EOF

      - name: Build Android App Bundle (.aab) and APK (.apk)
        working-directory: android_build
        run: gradle bundleRelease assembleDebug --no-daemon

      - name: Upload Ready-to-Publish Play Store AAB & Test APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberBlade-AdMob-PlayStore-Package
          path: |
            android_build/app/build/outputs/bundle/release/*.aab
            android_build/app/build/outputs/apk/debug/*.apk

